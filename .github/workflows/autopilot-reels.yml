name: Autonomous AI Reels & Posts Autopilot

on:
  schedule:
    # Runs twice daily at 06:30 UTC (12:00 PM IST) and 13:30 UTC (7:00 PM IST)
    - cron: "30 6,13 * * *"
  workflow_dispatch:
    inputs:
      custom_topic:
        description: "Optional custom Reel topic (leave empty to let Profile Analyzer pick)"
        required: false
        default: ""

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Autonomous Profile Audit + Code-to-Video Render + Auto-Post (IG & FB)
        env:
          VELONA_API_KEY: ${{ secrets.VELONA_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'anthropic/claude-sonnet-4-6' }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '' }}
          IG_BUSINESS_ACCOUNT_ID: ${{ vars.IG_BUSINESS_ACCOUNT_ID || '' }}
          PUBLIC_VIDEO_BASE_URL: ${{ vars.PUBLIC_VIDEO_BASE_URL || '' }}
          MONETIZATION_OFFER: ${{ vars.MONETIZATION_OFFER || 'AI Automation Blueprint (₹499)' }}
          MONETIZATION_URL: ${{ vars.MONETIZATION_URL || 'https://velona.in' }}
          DM_TRIGGER_KEYWORD: ${{ vars.DM_TRIGGER_KEYWORD || 'AUTO' }}
          AUTOMATION_MODE: "full_autopilot"
        run: node cli.js autopilot "${{ github.event.inputs.custom_topic }}"

      - name: Upload Generated MP4 Reel, Carousel Slides & Remotion .tsx Code Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-reel-${{ github.run_number }}
          path: |
            output/reels/*.mp4
            output/carousels/*.png
            output/code/*.tsx
          retention-days: 14
